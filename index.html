    <style type="text/tailwindcss">
        @layer utilities {
            .text-shadow {
                text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            }

                text-shadow: 4px 4px 8px rgba(0, 0, 0, 0.5);

            }

            .rotate-y-10 {

            .rotate-y-0 {

            .transition-3d {
                transition: transform 0.5s ease;

                height: 100%;
                overflow: hidden;

            }

                border: 2px solid #d4af37;

            .刮刮卡画布 {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;

                z-index: 3;

            }

                transform: translateX(5px);
                background-color: rgba(255, 255, 255, 0.1);
            }
            .中奖动画 {
                animation: 中奖闪烁 1s ease-in-out infinite alternate;
            }
            @keyframes 中奖闪烁 {
                from {
                    text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 15px #ffd700, 0 0 20px #ffd700;
                }
                to {
                    text-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 30px #ffd700, 0 0 40px #ffd700;
                }
            }
            .硬币动画 {
                animation: 硬币旋转 1s ease-in-out;
            }
            @keyframes 硬币旋转 {
                0% {
                    transform: rotateY(0deg) scale(1);
                }
                50% {
                    transform: rotateY(180deg) scale(1.2);
                }
                100% {

        // 绑定刮刮卡事件
        function 绑定刮刮卡事件() {
            const 画布 = 游戏状态.刮刮卡画布;
            const ctx = 游戏状态.刮刮卡上下文;
            let isDrawing = false;
            let lastX = 0;
            let lastY = 0;
            
            // 设置画笔样式
            ctx.lineWidth = 25;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            // 开始刮动
            function 开始刮动(e) {
                if (游戏状态.刮刮卡状态 !== '刮ing') return;
                
                isDrawing = true;
                const pos = 获取鼠标位置(e);
                lastX = pos.x;
                lastY = pos.y;
            }
            
            // 刮动中
            function 刮动中(e) {
                if (!isDrawing || 游戏状态.刮刮卡状态 !== '刮ing') return;
                
                const pos = 获取鼠标位置(e);
                ctx.beginPath();
                ctx.moveTo(lastX, lastY);
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
                lastX = pos.x;
                lastY = pos.y;
                
                // 检查刮开面积
                检查刮开面积();
            }
            
            // 结束刮动
            function 结束刮动() {
                isDrawing = false;
            }
            
            // 获取鼠标/触摸位置
            function 获取鼠标位置(e) {
                const rect = 画布.getBoundingClientRect();
                let x, y;
                
                if (e.type.includes('touch')) {
                    e.preventDefault();
                    x = e.touches[0].clientX - rect.left;
                    y = e.touches[0].clientY - rect.top;
                } else {
                    x = e.clientX - rect.left;
                    y = e.clientY - rect.top;
                }
                
                return { x, y };
            }
            
            // 绑定事件到刮刮卡区域，确保即使在涂层上也能触发
            const 刮刮卡区域 = 元素.刮刮卡容器.querySelector('.刮刮卡区域');
            
            // 鼠标事件
            刮刮卡区域.addEventListener('mousedown', 开始刮动);
            刮刮卡区域.addEventListener('mousemove', 刮动中);
            刮刮卡区域.addEventListener('mouseup', 结束刮动);
            刮刮卡区域.addEventListener('mouseout', 结束刮动);
            
            // 触摸事件
            刮刮卡区域.addEventListener('touchstart', 开始刮动);
            刮刮卡区域.addEventListener('touchmove', 刮动中);
            刮刮卡区域.addEventListener('touchend', 结束刮动);
            
            // 防止触摸事件的默认行为
            刮刮卡区域.addEventListener('touchmove', function(e) {
                e.preventDefault();
            }, { passive: false });
        }

        // 选择彩票
        function 选择彩票(彩票) {

            document.querySelector(`#彩票选择区 > div[data-id="${彩票.id}"]`).classList.add('border-gold', 'bg-dark');

        // 开始刮奖
        function 开始刮奖(彩票) {
            // 重置刮刮卡
            重置刮刮卡();
            
            // 设置游戏状态
            游戏状态.刮刮卡状态 = '刮ing';
            
            // 计算中奖金额
            游戏状态.中奖金额 = 计算中奖金额(彩票);
            
            // 设置中奖信息
            if (游戏状态.中奖金额 > 0) {
                元素.刮刮卡底层.innerHTML = `<span class="text-red-500 font-bold text-2xl">恭喜中奖 ¥${游戏状态.中奖金额}</span>`;

        // 重置刮刮卡
        function 重置刮刮卡() {
            const ctx = 游戏状态.刮刮卡上下文;
            const 画布 = 游戏状态.刮刮卡画布;
            
            // 重置画布
            ctx.clearRect(0, 0, 画布.width, 画布.height);
            ctx.fillStyle = 'rgba(0, 0, 0, 0)';
            ctx.fillRect(0, 0, 画布.width, 画布.height);
            
            // 确保涂层完全覆盖
            游戏状态.刮刮卡涂层.style.opacity = '1';
            游戏状态.刮刮卡涂层.style.display = 'block';
            
            // 重置状态
            游戏状态.刮刮卡状态 = '未开始';
            游戏状态.中奖金额 = 0;
            
            // 禁用按钮
            元素.全部刮开按钮.disabled = true;
        }

        // 计算中奖金额
        function 计算中奖金额(彩票) {
            const 随机数 = Math.random();
            let 累计概率 = 0;
            
            for (const [金额, 概率] of Object.entries(彩票.中奖概率)) {
                累计概率 += 概率;
                if (随机数 <= 累计概率) {
                    return parseInt(金额);
                }
            }
            
            return 0; // 默认不中奖
        }

        // 检查刮开面积
        function 检查刮开面积() {
            const ctx = 游戏状态.刮刮卡上下文;
            const 画布 = 游戏状态.刮刮卡画布;
            
            // 为了提高性能，只在一定间隔后检查
            if (!检查刮开面积.lastCheck || Date.now() - 检查刮开面积.lastCheck > 200) {
                检查刮开面积.lastCheck = Date.now();
                
                try {
                    const 像素数据 = ctx.getImageData(0, 0, 画布.width, 画布.height).data;
                    let 透明像素数 = 0;
                    const 总像素数 = 画布.width * 画布.height;
                    
                    // 计算透明像素数量（为了提高性能，我们可以采样而不是检查每个像素）
                    const 采样间隔 = 4; // 每隔几个像素检查一次
                    for (let i = 3; i < 像素数据.length; i += 4 * 采样间隔) {
                        if (像素数据[i] === 0) { // alpha通道为0表示完全透明
                            透明像素数 += 采样间隔;
                        }
                    }
                    
                    // 计算刮开比例
                    const 刮开比例 = 透明像素数 / 总像素数;
                    
                    // 如果刮开超过35%，自动完成刮奖
                    if (刮开比例 > 0.35) {
                        完成刮奖();
                    }
                } catch (e) {
                    console.error('检查刮开面积时出错:', e);
                }
            }
        }

        // 全部刮开
        function 全部刮开() {
            const ctx = 游戏状态.刮刮卡上下文;
            const 画布 = 游戏状态.刮刮卡画布;
            
            // 使用动画效果逐渐清除画布
            let 清除进度 = 0;
            const 清除动画 = setInterval(() => {
                清除进度 += 0.1;
                if (清除进度 >= 1) {
                    clearInterval(清除动画);
                    // 清除整个画布
                    ctx.clearRect(0, 0, 画布.width, 画布.height);
                    // 隐藏涂层
                    游戏状态.刮刮卡涂层.style.opacity = '0';
                    // 完成刮奖
                    完成刮奖();
                } else {
                    // 创建一个随机的清除效果
                    for (let i = 0; i < 20; i++) {
                        const x = Math.random() * 画布.width;
                        const y = Math.random() * 画布.height;
                        const radius = 10 + Math.random() * 20;
                        ctx.beginPath();
                        ctx.arc(x, y, radius, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }, 50);
        }

        // 完成刮奖
        function 完成刮奖() {
            if (游戏状态.刮刮卡状态 !== '刮ing') return;
            
            // 更新状态
            游戏状态.刮刮卡状态 = '已完成';
            
            // 隐藏涂层
            游戏状态.刮刮卡涂层.style.opacity = '0';
            
            // 如果中奖，显示中奖弹窗
            if (游戏状态.中奖金额 > 0) {
                // 增加余额
                游戏状态.当前余额 += 游戏状态.中奖金额;
                更新余额显示();
                
                // 记录中奖
                添加消费记录(`中得${游戏状态.当前彩票.名称}奖金`, 游戏状态.中奖金额);
                
                // 显示中奖弹窗
                显示中奖弹窗();
            }
        }

        // 显示中奖弹窗
        function 显示中奖弹窗() {
            元素.中奖彩票名称.textContent = `"${游戏状态.当前彩票.名称}"`;
            元素.中奖金额.textContent = 游戏状态.中奖金额;
            
            // 显示弹窗
            元素.中奖弹窗.classList.remove('hidden');
            
            // 添加动画效果
            setTimeout(() => {
                元素.中奖弹窗内容.classList.remove('scale-95', 'opacity-0');
                元素.中奖弹窗内容.classList.add('scale-100', 'opacity-100');
            }, 10);
            
            // 播放中奖音效（如果有）
            // playWinSound();
        }

        // 关闭中奖弹窗
        function 关闭中奖弹窗() {
            // 添加关闭动画
            元素.中奖弹窗内容.classList.remove('scale-100', 'opacity-100');
            元素.中奖弹窗内容.classList.add('scale-95', 'opacity-0');
            
            // 隐藏弹窗
            setTimeout(() => {
                元素.中奖弹窗.classList.add('hidden');
            }, 300);
        }

        // 充值
        function 充值(金额) {
            // 检查银行卡余额是否足够
            if (游戏状态.银行卡余额 < 金额) {
                alert('银行卡余额不足！');
                检查游戏结束();
                return;
            }
            
            // 显示支付弹窗
            显示支付弹窗(金额);
        }
        
        // 显示支付弹窗
        function 显示支付弹窗(金额) {
            // 设置支付金额
            元素.支付弹窗.dataset.amount = 金额;
            
            // 显示弹窗
            元素.支付弹窗.classList.remove('hidden');
            
            // 添加动画效果
            setTimeout(() => {
                元素.支付弹窗内容.classList.remove('scale-95', 'opacity-0');
                元素.支付弹窗内容.classList.add('scale-100', 'opacity-100');
            }, 10);
        }
        
        // 关闭支付弹窗
        function 关闭支付弹窗() {
            // 添加关闭动画
            元素.支付弹窗内容.classList.remove('scale-100', 'opacity-100');
            元素.支付弹窗内容.classList.add('scale-95', 'opacity-0');
            
            // 隐藏弹窗
            setTimeout(() => {
                元素.支付弹窗.classList.add('hidden');
            }, 300);
        }
        
        // 确认支付
        function 确认支付() {
            const 金额 = parseInt(元素.支付弹窗.dataset.amount);
            
            // 扣除银行卡余额
            游戏状态.银行卡余额 -= 金额;
            
            // 增加当前余额
            游戏状态.当前余额 += 金额;
            
            // 更新显示
            更新余额显示();
            添加消费记录('银行卡充值', 金额);
            
            // 添加硬币动画效果
            元素.当前余额.classList.add('硬币动画');
            setTimeout(() => {
                元素.当前余额.classList.remove('硬币动画');
            }, 1000);
            
            // 关闭支付弹窗
            关闭支付弹窗();
            
            // 检查游戏结束条件
            检查游戏结束();
        }

        // 更新余额显示
        function 更新余额显示() {
            元素.当前余额.textContent = 游戏状态.当前余额;
            元素.银行卡余额.textContent = 游戏状态.银行卡余额;
        }

        // 添加消费记录
        function 添加消费记录(描述, 金额) {
            const 记录 = {
                描述,
                金额,
                时间: new Date()
            };
            
            游戏状态.消费记录.unshift(记录);
            
            // 更新记录显示
            更新消费记录显示();
        }

        // 更新消费记录显示
        function 更新消费记录显示() {
            if (游戏状态.消费记录.length === 0) {
                元素.空记录提示.classList.remove('hidden');
                return;
            }
            
            元素.空记录提示.classList.add('hidden');
            
            // 清空记录区
            while (元素.消费记录区.firstChild) {
                if (元素.消费记录区.firstChild.id !== '空记录提示') {
                    元素.消费记录区.removeChild(元素.消费记录区.firstChild);
                } else {
                    break;
                }
            }
            
            // 添加记录
            游戏状态.消费记录.forEach(记录 => {
                const 记录元素 = document.createElement('div');
                记录元素.className = '记录项 flex items-center justify-between py-2 border-b border-gray-700 last:border-0';
                
                const 金额颜色 = 记录.金额 > 0 ? 'text-green-400' : 'text-red-400';
                const 金额符号 = 记录.金额 > 0 ? '+' : '';
                
                记录元素.innerHTML = `
                    <div>
                        <div>${记录.描述}</div>
                        <div class="text-xs text-gray-400">${记录.时间.toLocaleTimeString()}</div>
                    </div>
                    <div class="${金额颜色} font-bold">${金额符号}${记录.金额}元</div>
                `;
                
                // 插入到空记录提示之前
                元素.消费记录区.insertBefore(记录元素, 元素.空记录提示);
            });
        }

        // 检查游戏结束
        function 检查游戏结束() {
            if (游戏状态.当前余额 <= 0 && 游戏状态.银行卡余额 <= 0) {
                // 游戏结束，显示统计信息
                显示游戏结束统计();
            }
        }
        
        // 显示游戏结束统计
        function 显示游戏结束统计() {
            // 计算统计数据
            const 总消费 = 游戏状态.消费记录.filter(r => r.金额 < 0).reduce((sum, r) => sum + Math.abs(r.金额), 0);
            const 总中奖 = 游戏状态.消费记录.filter(r => r.金额 > 0).reduce((sum, r) => sum + r.金额, 0);
            const 净收益 = 总中奖 - 总消费;
            
            // 设置统计数据
            元素.总消费金额.textContent = 总消费;
            元素.总中奖金额.textContent = 总中奖;
            元素.净收益.textContent = 净收益;
            元素.净收益.className = 净收益 >= 0 ? 'text-2xl font-bold text-green-400' : 'text-2xl font-bold text-red-400';
            
            // 绘制交易趋势图
            绘制交易趋势图();
            
            // 显示游戏结束弹窗
            元素.游戏结束弹窗.classList.remove('hidden');
        }
        
        // 绘制交易趋势图
        function 绘制交易趋势图() {
            const ctx = 元素.交易趋势图.getContext('2d');
            
            // 清空画布
            ctx.clearRect(0, 0, 元素.交易趋势图.width, 元素.交易趋势图.height);
            
            if (游戏状态.消费记录.length === 0) return;
            
            // 准备数据
            const 数据 = [];
            let 当前余额 = 100; // 初始余额
            
            数据.push(当前余额);
            
            游戏状态.消费记录.forEach(记录 => {
                当前余额 += 记录.金额;
                数据.push(当前余额);
            });
            
            // 设置图表样式
            ctx.strokeStyle = '#ffd700';
            ctx.lineWidth = 2;
            ctx.fillStyle = 'rgba(255, 215, 0, 0.1)';
            
            // 绘制趋势线
            const 宽度 = 元素.交易趋势图.width - 40;
            const 高度 = 元素.交易趋势图.height - 40;
            const 最大余额 = Math.max(...数据, 100);
            const 最小余额 = Math.min(...数据, 0);
            const 余额范围 = 最大余额 - 最小余额 || 1;
            
            ctx.beginPath();
            ctx.moveTo(20, 高度 - ((数据[0] - 最小余额) / 余额范围) * 高度 + 20);
            
            for (let i = 1; i < 数据.length; i++) {
                const x = 20 + (i / (数据.length - 1)) * 宽度;
                const y = 高度 - ((数据[i] - 最小余额) / 余额范围) * 高度 + 20;
                ctx.lineTo(x, y);
            }
            
            ctx.stroke();
            
            // 绘制填充区域
            ctx.lineTo(元素.交易趋势图.width - 20, 元素.交易趋势图.height - 20);
            ctx.lineTo(20, 元素.交易趋势图.height - 20);
            ctx.closePath();
            ctx.fill();
            
            // 绘制坐标轴
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(20, 20);
            ctx.lineTo(20, 元素.交易趋势图.height - 20);
            ctx.lineTo(元素.交易趋势图.width - 20, 元素.交易趋势图.height - 20);
            ctx.stroke();
        }
        
        // 初始化游戏
        window.addEventListener('DOMContentLoaded', 初始化游戏);
    </script>
</body>
</html>
